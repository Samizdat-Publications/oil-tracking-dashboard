# Rebuild the data snapshot from FRED, EIA, Treasury and IMF PortWatch, gate it,
# build the site, deploy to Cloudflare Pages, and commit the snapshot back.
#
# Runs weekdays at 13:00 UTC (09:00 ET), after FRED's morning update and after
# EIA's Monday/Wednesday weeklies. The validate gate means a failed upstream
# leaves the previous deploy live rather than shipping a page full of dashes.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   FRED_API_KEY, EIA_API_KEY, CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
name: refresh-and-deploy

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Build snapshot
        working-directory: backend
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CACHE_DB_PATH: ${{ runner.temp }}/cache.db
        run: python scripts/build_snapshot.py

      - name: Validate snapshot (gate)
        working-directory: backend
        run: python scripts/validate_snapshot.py ../frontend/public/data-snapshot.json

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test --if-present
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name trumps-economy-ledger --branch main --commit-dirty=true

      # Only after a successful deploy, so main never carries a snapshot that
      # was not shipped. Skipped when nothing changed.
      - name: Commit refreshed snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add frontend/public/data-snapshot.json frontend/public/og.png frontend/public/og.html
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "data: snapshot $(date -u +%F) [skip ci]"
            git push
          fi
